
<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐍 Zoro Snake Game</title>

<style>

/* ================= RESET ================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

/* ================= BODY ================= */

body {
    font-family: Arial, sans-serif;
    text-align: center;
    color: #5c609c;
    background: #172033;
}

/* ================= PAGE LAYOUT ================= */

.page-layout {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        70px
        minmax(0, 850px)
        70px
        minmax(0, 1fr);

    gap: 0;

    width: 100%;
    max-width: none;
    min-height: 100vh;

    margin: 0;
    padding: 0;

    align-items: stretch;
}

/* ================= SIDE ADS ================= */

/* # GOOGLE ADS CODE HERE
   Google AdSense code can be placed
   inside the side-ad areas in future.
*/

.side-ad {
    width: 100%;
    min-height: 100vh;

    background: #172033;

    border: none;
    border-radius: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #93b5d8;
    font-size: 14px;

    padding: 10px;

    text-align: center;
}

/* ================= GAME RAIL ================= */

/* RED BACKGROUND REMOVED
   DARK BLUE BACKGROUND KEPT
*/

.game-rail {
    width: 100%;
    min-height: 100vh;

    background: #172033;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 14px;

    padding: 10px 5px;
}

/* ================= OTHER GAME LINKS ================= */

.other-game {
    display: flex;

    width: 58px;
    height: 58px;

    justify-content: center;
    align-items: center;

    text-decoration: none;

    background: #172033;

    border: 1px solid #44506a;
    border-radius: 12px;

    color: white;

    font-size: 24px;

    transition: 0.2s;
}

.other-game:hover {
    background: #263652;
    transform: scale(1.08);
}

.other-game:active {
    transform: scale(0.96);
}

/* ================= GAME CENTER ================= */

.game {
    width: 100%;
    min-width: 0;
    min-height: 100vh;

    padding: 18px 10px;

    background: #dceeff;

    text-align: center;
}

/* ================= TITLE ================= */

h1 {
    margin: 5px 0 10px;
    font-size: clamp(24px, 4vw, 38px);
}

/* ================= SCORE ================= */

.score {
    font-size: 19px;
    margin-bottom: 10px;
}

/* ================= SPEED ================= */

.speed {
    margin-bottom: 12px;
}

.speed button {
    padding: 7px 12px;
    margin: 3px;

    border: 0;
    border-radius: 7px;

    background: white;
    color: #111;

    cursor: pointer;
    font-size: 14px;
}

.speed button.active {
    background: #17324d;
    color: white;
}

/* ================= CANVAS ================= */

canvas {
    display: block;

    width: min(90vw, 500px);
    height: auto;

    max-width: 100%;
    aspect-ratio: 1 / 1;

    margin: 0 auto;

    background: #f8fbff;

    border: 3px solid #17324d;
    border-radius: 10px;

    box-sizing: border-box;
}

/* ================= MESSAGE ================= */

#message {
    margin: 12px;

    font-size: 17px;
    min-height: 22px;
}

/* ================= BUTTONS ================= */

.main-btn {
    padding: 10px 18px;
    margin: 5px;

    font-size: 16px;

    border: 0;
    border-radius: 8px;

    cursor: pointer;

    background: white;
    color: #17324d;
}

.main-btn:hover {
    opacity: 0.85;
}

.main-btn:active {
    transform: scale(0.97);
}

.main-btn:focus-visible,
.speed button:focus-visible,
.control-btn:focus-visible,
.other-game:focus-visible {
    outline: 3px solid #248cff;
    outline-offset: 2px;
}

/* ================= CONTROLS ================= */

.controls {
    width: 190px;
    margin: 10px auto;

    touch-action: manipulation;
}

.control-row {
    display: flex;
    justify-content: center;
}

.control-btn {
    width: 55px;
    height: 45px;

    padding: 0;
    margin: 2px;

    font-size: 20px;

    border: 0;
    border-radius: 8px;

    cursor: pointer;

    background: white;
    color: #17324d;

    touch-action: manipulation;
}

.control-btn:active {
    background: #c7d9eb;
}

/* ================= MOBILE ================= */

@media (max-width: 1100px) {

    .page-layout {
        grid-template-columns:
            minmax(0, 1fr)
            60px
            minmax(0, 850px)
            60px
            minmax(0, 1fr);
    }

    .other-game {
        width: 48px;
        height: 48px;
        font-size: 20px;
    }

}

@media (max-width: 900px) {

    .page-layout {
        display: block;
        min-height: 100vh;
    }

    .side-ad,
    .game-rail {
        display: none;
    }

    .game {
        width: 100%;
        min-height: 100vh;
        padding: 10px 5px;
    }

    h1 {
        font-size: 25px;
    }

    .score {
        font-size: 17px;
    }

}

/* ================= SMALL MOBILE ================= */

@media (max-width: 400px) {

    .game {
        padding: 5px 0;
    }

    h1 {
        font-size: 22px;
    }

    .speed button {
        padding: 6px 9px;
        font-size: 12px;
    }

    .main-btn {
        padding: 9px 14px;
        font-size: 14px;
    }

    .control-btn {
        width: 50px;
        height: 42px;
    }

}

/* ================= REDUCED MOTION ================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        scroll-behavior: auto;
    }

    .other-game {
        transition: none;
    }

}

</style>
</head>

<body>

<!-- ================= PAGE START ================= -->

<div class="page-layout">

    <!-- ================= LEFT AD ================= -->

    <!-- # GOOGLE ADS CODE HERE
         Add Google AdSense code inside this area.
    -->

    <aside class="side-ad" aria-label="Advertisement">
        Advertisement
    </aside>

    <!-- ================= LEFT GAME RAIL ================= -->

    <nav class="game-rail" aria-label="Other Games">

        <a
            class="other-game"
            href="game1.html"
            aria-label="Game 1"
            title="Game 1">
            🎮
        </a>

        <a
            class="other-game"
            href="game2.html"
            aria-label="Game 2"
            title="Game 2">
            🕹️
        </a>

        <a
            class="other-game"
            href="game3.html"
            aria-label="Game 3"
            title="Game 3">
            🚀
        </a>

        <a
            class="other-game"
            href="game4.html"
            aria-label="Game 4"
            title="Game 4">
            🧩
        </a>

    </nav>

    <!-- ================= GAME CENTER ================= -->

    <main class="game">

        <h1>🐍 Snake Game 🍎</h1>

        <!-- SCORE -->

        <div class="score">

            Score:
            <span id="score">0</span>

            &nbsp;&nbsp;

            Best:
            <span id="best">0</span>

        </div>

        <!-- SPEED -->

        <div class="speed">

            <b>Speed:</b>

            <button
                id="slow"
                type="button"
                onclick="setSpeed(170)">

                🐢 Slow

            </button>

            <button
                id="medium"
                type="button"
                onclick="setSpeed(110)">

                ⚡ Medium

            </button>

            <button
                id="fast"
                type="button"
                onclick="setSpeed(70)">

                🚀 Fast

            </button>

        </div>

        <!-- GAME CANVAS -->

        <canvas
            id="game"
            width="500"
            height="500"
            aria-label="Snake game board">
        </canvas>

        <!-- MESSAGE -->

        <div
            id="message"
            role="status"
            aria-live="polite">

            Arrow Keys से Snake चलाओ

        </div>

        <!-- BUTTONS -->

        <button
            class="main-btn"
            type="button"
            onclick="restartGame()">

            🔄 Restart

        </button>

        <a href="index.html">

            <button
                class="main-btn"
                type="button">

                🏠 Home

            </button>

        </a>

        <!-- MOBILE CONTROLS -->

        <div class="controls">

            <div class="control-row">

                <button
                    class="control-btn"
                    type="button"
                    aria-label="Move Up"
                    onclick="changeDirection('UP')">

                    ⬆️

                </button>

            </div>

            <div class="control-row">

                <button
                    class="control-btn"
                    type="button"
                    aria-label="Move Left"
                    onclick="changeDirection('LEFT')">

                    ⬅️

                </button>

                <button
                    class="control-btn"
                    type="button"
                    aria-label="Move Down"
                    onclick="changeDirection('DOWN')">

                    ⬇️

                </button>

                <button
                    class="control-btn"
                    type="button"
                    aria-label="Move Right"
                    onclick="changeDirection('RIGHT')">

                    ➡️

                </button>

            </div>

        </div>

    </main>

    <!-- ================= RIGHT GAME RAIL ================= -->

    <nav class="game-rail" aria-label="Other Games">

        <a
            class="other-game"
            href="game1.html"
            aria-label="Game 1"
            title="Game 1">
            🎮
        </a>

        <a
            class="other-game"
            href="game2.html"
            aria-label="Game 2"
            title="Game 2">
            🕹️
        </a>

        <a
            class="other-game"
            href="game3.html"
            aria-label="Game 3"
            title="Game 3">
            🚀
        </a>

        <a
            class="other-game"
            href="game4.html"
            aria-label="Game 4"
            title="Game 4">
            🧩
        </a>

    </nav>

    <!-- ================= RIGHT AD ================= -->

    <!-- # GOOGLE ADS CODE HERE
         Add Google AdSense code inside this area.
    -->

    <aside class="side-ad" aria-label="Advertisement">
        Advertisement
    </aside>

</div>

<!-- ================= JAVASCRIPT ================= -->

<script>

/* ================= CANVAS ================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 25;
const boardSize = 500;
const gridSize = boardSize / box;

/* ================= GAME VARIABLES ================= */

let snake = [];
let apple = null;

let direction = "RIGHT";
let nextDirection = "RIGHT";

let score = 0;

let best = Number(
    localStorage.getItem("snakeBest") || 0
);

let speed = 110;
let gameLoop = null;
let gameRunning = false;

document.getElementById("best").textContent = best;

/* ================= SOUND ================= */

let audioContext = null;

function startAudio() {

    try {

        if (!audioContext) {

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if (!AudioContext) return;

            audioContext = new AudioContext();

        }

        if (audioContext.state === "suspended") {

            audioContext.resume().catch(() => {});

        }

    } catch (error) {

        console.log("Audio unavailable");

    }

}

function playTone(
    frequency,
    duration,
    type = "sine"
) {

    if (!audioContext) return;

    try {

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = type;
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(
            0.12,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + duration
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + duration
        );

    } catch (error) {

        console.log("Sound error");

    }

}

function appleSound() {

    playTone(600, 0.08);

    setTimeout(() => {

        playTone(850, 0.10);

    }, 80);

}

function gameOverSound() {

    playTone(350, 0.15, "square");

    setTimeout(() => {

        playTone(220, 0.25, "square");

    }, 150);

}

function bestSound() {

    playTone(600, 0.10);

    setTimeout(() => {

        playTone(800, 0.10);

    }, 100);

    setTimeout(() => {

        playTone(1000, 0.18);

    }, 200);

}

/* ================= SPEED ================= */

function setSpeed(newSpeed) {

    speed = newSpeed;

    document
        .querySelectorAll(".speed button")
        .forEach(button => {

            button.classList.remove("active");

        });

    if (newSpeed === 170) {

        document
            .getElementById("slow")
            .classList.add("active");

    }

    if (newSpeed === 110) {

        document
            .getElementById("medium")
            .classList.add("active");

    }

    if (newSpeed === 70) {

        document
            .getElementById("fast")
            .classList.add("active");

    }

    if (gameRunning) {

        clearInterval(gameLoop);

        gameLoop = setInterval(drawGame, speed);

    }

}

/* ================= START GAME ================= */

function startGame() {

    clearInterval(gameLoop);

    snake = [

        {x: 250, y: 250},
        {x: 225, y: 250},
        {x: 200, y: 250},
        {x: 175, y: 250}

    ];

    direction = "RIGHT";
    nextDirection = "RIGHT";

    score = 0;

    document
        .getElementById("score")
        .textContent = score;

    document
        .getElementById("message")
        .textContent =
        "Arrow Keys से Snake चलाओ";

    gameRunning = true;

    createApple();

    drawBoard();
    drawApple();
    drawSnake();

    gameLoop = setInterval(drawGame, speed);

}

/* ================= DRAW BOARD ================= */

function drawBoard() {

    ctx.fillStyle = "#f8fbff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.strokeStyle = "#e1ebf5";
    ctx.lineWidth = 1;

    for (
        let x = 0;
        x <= boardSize;
        x += box
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);
        ctx.lineTo(x, boardSize);

        ctx.stroke();

    }

    for (
        let y = 0;
        y <= boardSize;
        y += box
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);
        ctx.lineTo(boardSize, y);

        ctx.stroke();

    }

}

/* ================= DRAW GAME ================= */

function drawGame() {

    if (!gameRunning) return;

    direction = nextDirection;

    let head = {

        x: snake[0].x,
        y: snake[0].y

    };

    if (direction === "LEFT") {
        head.x -= box;
    }

    if (direction === "RIGHT") {
        head.x += box;
    }

    if (direction === "UP") {
        head.y -= box;
    }

    if (direction === "DOWN") {
        head.y += box;
    }

    /* WALL COLLISION */

    if (

        head.x < 0 ||
        head.y < 0 ||
        head.x >= boardSize ||
        head.y >= boardSize

    ) {

        gameOver();
        return;

    }

    /* APPLE CHECK */

    const eatingApple =
        head.x === apple.x &&
        head.y === apple.y;

    /* SELF COLLISION */

    const bodyToCheck = eatingApple
        ? snake
        : snake.slice(0, -1);

    for (let part of bodyToCheck) {

        if (

            head.x === part.x &&
            head.y === part.y

        ) {

            gameOver();
            return;

        }

    }

    /* ADD NEW HEAD */

    snake.unshift(head);

    /* APPLE */

    if (eatingApple) {

        score++;

        document
            .getElementById("score")
            .textContent = score;

        appleSound();

        if (score > best) {

            best = score;

            document
                .getElementById("best")
                .textContent = best;

            localStorage.setItem(
                "snakeBest",
                best
            );

            bestSound();

        }

        createApple();

    } else {

        snake.pop();

    }

    drawBoard();
    drawApple();
    drawSnake();

}

/* ================= DRAW SNAKE ================= */

function drawSnake() {

    for (
        let i = snake.length - 1;
        i >= 0;
        i--
    ) {

        const part = snake[i];

        if (i === 0) {

            ctx.fillStyle = "#39d353";

        } else {

            ctx.fillStyle = "#159447";

        }

        ctx.fillRect(
            part.x,
            part.y,
            box,
            box
        );

        if (i === 0) {

            drawSnakeFace(
                part.x,
                part.y
            );

        }

    }

}

/* ================= SNAKE FACE ================= */

function drawSnakeFace(x, y) {

    ctx.fillStyle = "#111";

    let eye1;
    let eye2;

    if (direction === "RIGHT") {

        eye1 = {
            x: x + 17,
            y: y + 7
        };

        eye2 = {
            x: x + 17,
            y: y + 17
        };

    } else if (direction === "LEFT") {

        eye1 = {
            x: x + 7,
            y: y + 7
        };

        eye2 = {
            x: x + 7,
            y: y + 17
        };

    } else if (direction === "UP") {

        eye1 = {
            x: x + 7,
            y: y + 7
        };

        eye2 = {
            x: x + 17,
            y: y + 7
        };

    } else {

        eye1 = {
            x: x + 7,
            y: y + 17
        };

        eye2 = {
            x: x + 17,
            y: y + 17
        };

    }

    ctx.beginPath();

    ctx.arc(
        eye1.x,
        eye1.y,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        eye2.x,
        eye2.y,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();

}

/* ================= APPLE ================= */

function drawApple() {

    if (!apple) return;

    ctx.fillStyle = "#ef3030";

    ctx.beginPath();

    ctx.arc(
        apple.x + 12,
        apple.y + 13,
        9,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = "#159447";

    ctx.beginPath();

    ctx.ellipse(
        apple.x + 18,
        apple.y + 4,
        6,
        3,
        -0.5,
        0,
        Math.PI * 2
    );

    ctx.fill();

}

/* ================= CREATE APPLE ================= */

function createApple() {

    let valid = false;
    let attempts = 0;

    while (!valid && attempts < 500) {

        attempts++;

        apple = {

            x:
                Math.floor(
                    Math.random() * gridSize
                ) * box,

            y:
                Math.floor(
                    Math.random() * gridSize
                ) * box

        };

        valid = true;

        for (let part of snake) {

            if (

                apple.x === part.x &&
                apple.y === part.y

            ) {

                valid = false;
                break;

            }

        }

    }

}

/* ================= GAME OVER ================= */

function gameOver() {

    gameRunning = false;

    clearInterval(gameLoop);
    gameLoop = null;

    gameOverSound();

    document
        .getElementById("message")
        .textContent =
        "💥 Game Over! Score: " + score;

}

/* ================= RESTART ================= */

function restartGame() {

    startAudio();
    startGame();

}

/* ================= DIRECTION ================= */

function changeDirection(newDirection) {

    startAudio();

    if (
        newDirection === "LEFT" &&
        direction !== "RIGHT"
    ) {

        nextDirection = "LEFT";

    }

    if (
        newDirection === "RIGHT" &&
        direction !== "LEFT"
    ) {

        nextDirection = "RIGHT";

    }

    if (
        newDirection === "UP" &&
        direction !== "DOWN"
    ) {

        nextDirection = "UP";

    }

    if (
        newDirection === "DOWN" &&
        direction !== "UP"
    ) {

        nextDirection = "DOWN";

    }

}

/* ================= KEYBOARD ================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowLeft") {

            changeDirection("LEFT");
            event.preventDefault();

        }

        if (event.key === "ArrowRight") {

            changeDirection("RIGHT");
            event.preventDefault();

        }

        if (event.key === "ArrowUp") {

            changeDirection("UP");
            event.preventDefault();

        }

        if (event.key === "ArrowDown") {

            changeDirection("DOWN");
            event.preventDefault();

        }

    }
);

/* ================= DEFAULT ================= */

setSpeed(110);
startGame();

</script>

</body>
</html>
